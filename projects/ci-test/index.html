<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1020;
        --ink: #eef2ff;
        --accent: #5eead4;
        --muted: #94a3b8;
        --font-display: "Inter", "Segoe UI", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; opacity: 0; }
      .big { color: var(--ink); font-size: 150px; font-weight: 800; letter-spacing: -0.04em; }
      .big em { font-style: normal; color: var(--accent); }
      .line { color: var(--muted); font-size: 44px; }
      .count { color: var(--accent); font-size: 220px; font-weight: 800; font-variant-numeric: tabular-nums; }
      .chips { display: flex; gap: 24px; }
      .chip { color: var(--ink); font-size: 40px; padding: 14px 32px; border: 2px solid var(--accent); border-radius: 999px; }
      .glow { position: absolute; width: 1200px; height: 1200px; left: 360px; top: -60px; border-radius: 50%;
              background: radial-gradient(circle, rgba(94,234,212,0.18), rgba(94,234,212,0) 60%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
      <div class="glow" id="glow"></div>
      <div class="scene" id="s1">
        <div class="big">Kod<em>Vid</em></div>
        <div class="line">GitHub Actions render testi</div>
      </div>
      <div class="scene" id="s2">
        <div class="count" id="count">0</div>
        <div class="line">skill, tek repoda</div>
      </div>
      <div class="scene" id="s3">
        <div class="chips">
          <div class="chip">HyperFrames</div>
          <div class="chip">GSAP</div>
          <div class="chip">FFmpeg</div>
        </div>
        <div class="line">4 cekirdek, ucretsiz</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#glow", { x: 240, y: 120, scale: 1.3, duration: 15, ease: "none" }, 0);
      // Sahne 1
      tl.fromTo("#s1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.to("#s1", { opacity: 0, x: -200, duration: 0.5, ease: "power3.in" }, 4.5);
      // Sahne 2
      tl.fromTo("#s2", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 5);
      const counter = { v: 0 };
      tl.to(counter, { v: 808, duration: 2.5, ease: "power2.out",
        onUpdate: () => { document.getElementById("count").textContent = Math.round(counter.v); } }, 5.3);
      tl.to("#s2", { opacity: 0, scale: 0.85, duration: 0.5, ease: "power3.in" }, 9.5);
      // Sahne 3
      tl.fromTo("#s3", { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 10);
      tl.fromTo(".chip", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.2, ease: "back.out(2)" }, 10.3);
      tl.to("#s3", { opacity: 0, duration: 0.6 }, 14.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
