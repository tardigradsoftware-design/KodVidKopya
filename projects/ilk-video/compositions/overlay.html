  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#ov-progress", { scaleX: 0 }, { scaleX: 1, duration: 10, ease: "none" }, 0);
    tl.fromTo("#ov-playhead", { x: 0 }, { x: 1917, duration: 10, ease: "none" }, 0);

    const clock = { t: 0 };
    const tc = document.getElementById("ov-tc");
    tl.to(
      clock,
      {
        t: 10,
        duration: 10,
        ease: "none",
        onUpdate: () => {
          const s = Math.floor(clock.t);
          const d = Math.floor((clock.t - s) * 10);
          tc.textContent = "00:" + String(s).padStart(2, "0") + "." + d;
        },
      },
      0,
    );

    window.__timelines["overlay"] = tl;
