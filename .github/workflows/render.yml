# KodVid GitHub render hatti (tek is, bekleme yok).
# projects/<ad>/render.json herhangi bir dala push edilince:
#   lint + check + kare onizleme, mode=render ise video
# Sonuclar "renders" dalina <ad>/ klasoru olarak yazilir; ajan bunlari git ile ceker
# (setup/cloud-render.sh). Videolar ayrica "render-<ad>" release'ine yuklenir.
name: Render

on:
  push:
    branches: ['**', '!renders']
    paths: ['projects/*/render.json']
  workflow_dispatch:
    inputs:
      project:
        description: 'projects/ altindaki klasor adi'
        required: true

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: projects

      - name: Projeleri bul
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_PROJECT" ]; then
            list="$INPUT_PROJECT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            list=$(git diff --name-only HEAD~1 HEAD -- 'projects/*/render.json' 2>/dev/null | cut -d/ -f2)
            [ -z "$list" ] && list=$(git show --name-only --format= HEAD -- 'projects/*/render.json' | cut -d/ -f2)
          else
            list=$(git diff --name-only "$BEFORE" HEAD -- 'projects/*/render.json' | cut -d/ -f2)
          fi
          ok=$(for p in $list; do if [[ "$p" =~ ^[A-Za-z0-9._-]+$ ]] && [ -f "projects/$p/render.json" ]; then echo "$p"; fi; done | sort -u | tr '\n' ' ')
          echo "Projeler: $ok"
          echo "LIST=$ok" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: env.LIST != ''
        with:
          node-version: 22

      # Statik FFmpeg, Chrome ve npm paketleri onbellekte: kurulum birkac saniye surer
      - uses: actions/cache@v4
        if: env.LIST != ''
        with:
          path: |
            ~/ffmpeg
            ~/.cache/hyperframes
            ~/.npm/_npx
          key: kodvid-tools-${{ runner.os }}-v2

      - name: Araclar
        if: env.LIST != ''
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if [ ! -x "$HOME/ffmpeg/bin/ffmpeg" ]; then
            curl -fsSL --retry 3 --max-time 240 \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ -C "$HOME"
            rm -rf "$HOME/ffmpeg" && mv "$HOME/ffmpeg-master-latest-linux64-gpl" "$HOME/ffmpeg"
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          need=""; for p in libnss3 libnspr4; do dpkg -s "$p" >/dev/null 2>&1 || need="$need $p"; done
          if [ -n "$need" ]; then
            APT="-o Acquire::http::Timeout=30 -o Acquire::Retries=2 -o DPkg::Lock::Timeout=60"
            sudo apt-get $APT update -qq && sudo apt-get $APT install -y -qq --no-install-recommends $need
          fi
          npx -y hyperframes browser ensure

      - name: Kontrol ve render
        if: env.LIST != ''
        run: |
          set +e   # bir projedeki hata digerlerini ve sonuc dosyasini durdurmasin
          export TMPDIR="$RUNNER_TEMP"
          ROOT="$PWD"; OUTS="$RUNNER_TEMP/out"; mkdir -p "$OUTS"
          for P in $LIST; do
            echo "::group::$P"
            O="$OUTS/$P"; mkdir -p "$O/snapshots"; f="$ROOT/projects/$P/render.json"
            mode=$(jq -r '.mode // "render"' "$f");  [[ "$mode" =~ ^(render|check)$ ]] || mode=render
            q=$(jq -r '.quality // "delivery"' "$f"); [[ "$q" =~ ^(draft|looks|delivery|standard|high)$ ]] || q=delivery
            fps=$(jq -r '.fps // 30' "$f");          [[ "$fps" =~ ^(24|30|60)$ ]] || fps=30
            comp=$(jq -r '.composition // "index.html"' "$f"); [[ "$comp" =~ ^[A-Za-z0-9._/-]+$ && "$comp" != *..* ]] || comp=index.html
            at=$(jq -r '.snapshot_at // ""' "$f" | tr -cd '0-9.,')
            frames=$(jq -r '.snapshot_frames // 6' "$f"); [[ "$frames" =~ ^[0-9]{1,2}$ ]] || frames=6
            req=$(jq -r '.request // ""' "$f" | tr -cd 'A-Za-z0-9._:+-' | cut -c1-80)
            cd "$ROOT/projects/$P"
            npx -y hyperframes lint > "$O/lint.txt" 2>&1; lint=$?
            npx -y hyperframes check --json > "$O/check.json" 2> "$O/check.log"
            if [ -n "$at" ]; then npx -y hyperframes snapshot --at "$at" --output "$O/snapshots" > /dev/null 2>&1
            else npx -y hyperframes snapshot --frames "$frames" --output "$O/snapshots" > /dev/null 2>&1; fi
            status=failed; secs=0; dur=null; w=null; h=null; size=0; mp4="$O/$P.mp4"
            if [ "$mode" = render ]; then
              s=$(date +%s)
              npx -y hyperframes render --composition "$comp" --quality "$q" --fps "$fps" --workers auto --output "$mp4" > "$O/render.log" 2>&1; rc=$?
              secs=$(( $(date +%s) - s )); tail -3 "$O/render.log"
              if [ "$rc" = 0 ] && [ -s "$mp4" ]; then
                status=ok
                dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$mp4")
                w=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$mp4")
                h=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$mp4")
                size=$(stat -c %s "$mp4")
              fi
            else
              [ "$lint" = 0 ] && status=checked
            fi
            check_ok=$(jq -r '.ok // false' "$O/check.json" 2>/dev/null || echo false)
            jq -n --arg project "$P" --arg request "$req" --arg mode "$mode" --arg status "$status" \
              --arg commit "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg finished "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg quality "$q" --argjson fps "$fps" \
              --argjson lint_ok "$([ "$lint" = 0 ] && echo true || echo false)" --argjson check_ok "$check_ok" \
              --argjson seconds "$secs" --argjson duration "${dur:-null}" --argjson width "${w:-null}" \
              --argjson height "${h:-null}" --argjson bytes "$size" \
              '{project:$project, request:$request, mode:$mode, status:$status, lint_ok:$lint_ok, check_ok:$check_ok,
                commit:$commit, branch:$branch, run:$run, finished:$finished, quality:$quality, fps:$fps,
                render_seconds:$seconds, duration:$duration, width:$width, height:$height, bytes:$bytes}' > "$O/result.json"
            cat "$O/result.json"
            { echo "### $P: $status"; echo '```json'; cat "$O/result.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # Kullanici icin release (arka planda, renders yazimini bekletmesin)
            if [ "$mode" = render ]; then
              ( tag="render-$P"
                gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Render: $P" --notes "KodVid otomatik render ciktisi." >/dev/null
                files=("$O/result.json"); [ -s "$mp4" ] && files+=("$mp4")
                gh release upload "$tag" "${files[@]}" --clobber >/dev/null 2>&1 ) &
            fi
            cd "$ROOT"
            echo "::endgroup::"
          done
          wait

      - name: renders dalina yaz
        if: always() && env.LIST != ''
        env:
          TOKEN: ${{ github.token }}
          KEEP: 20
        run: |
          shopt -s nullglob
          OUTS="$RUNNER_TEMP/out"; found=("$OUTS"/*/result.json)
          [ "${#found[@]}" -gt 0 ] || { echo "Yazilacak sonuc yok"; exit 1; }
          git config --global user.name "kodvid-render"
          git config --global user.email "kodvid-render@users.noreply.github.com"
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for try in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/work" && git init -q "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
            old=$(git ls-remote "$url" refs/heads/renders | cut -f1)
            if [ -n "$old" ]; then git fetch -q --depth 1 "$url" renders && git checkout -q --detach FETCH_HEAD; fi
            for d in "$OUTS"/*/; do p=$(basename "$d"); rm -rf "$p"; cp -r "$d" "$p"; done
            ls -d */ 2>/dev/null | while read -r d; do t=$(jq -r '.finished // ""' "$d/result.json" 2>/dev/null); echo "$t ${d%/}"; done \
              | sort -r | tail -n +$((KEEP+1)) | awk '{print $2}' | xargs -r rm -rf
            printf '# renders\n\nKodVid GitHub render sonuclari. Otomatik yazilir, elle duzenlemeyin.\n' > README.md
            git add -A
            commit=$(git commit-tree "$(git write-tree)" -m "renders: ${GITHUB_SHA::7}")
            if git push -q --force-with-lease="renders:${old}" "$url" "$commit:refs/heads/renders"; then echo "Yazildi"; exit 0; fi
            sleep $((try * 3))
          done
          echo "renders dalina yazilamadi"; exit 1
