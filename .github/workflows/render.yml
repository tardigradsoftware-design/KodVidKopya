# KodVid hizli render: projects/<ad>/render.json push edilince GitHub'in 4 cekirdekli
# sunucusunda HyperFrames render alir ve sonucu "render-<ad>" release'ine koyar.
# Ajan sonucu setup/cloud-render.sh ile bekler ve indirir.
name: Render

on:
  push:
    branches: [main]
    paths: ['projects/*/render.json']
  workflow_dispatch:
    inputs:
      project:
        description: 'projects/ altindaki klasor adi'
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: projects
      - id: find
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_PROJECT" ]; then
            list="$INPUT_PROJECT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            list=$(git diff --name-only HEAD~1 HEAD -- 'projects/*/render.json' | cut -d/ -f2)
          else
            list=$(git diff --name-only "$BEFORE" HEAD -- 'projects/*/render.json' | cut -d/ -f2)
          fi
          # Sadece guvenli klasor adlari ve gercekten var olan projeler
          json=$(for p in $list; do if [[ "$p" =~ ^[A-Za-z0-9._-]+$ ]] && [ -f "projects/$p/render.json" ]; then echo "$p"; fi; done | sort -u | jq -R . | jq -sc .)
          echo "Projeler: $json"
          echo "projects=$json" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.plan.outputs.projects) }}
    concurrency:
      group: render-${{ matrix.project }}
      cancel-in-progress: true
    env:
      P: ${{ matrix.project }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: projects/${{ matrix.project }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: FFmpeg ve Chrome kutuphaneleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libnspr4 >/dev/null

      - uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-chrome-${{ runner.os }}-v1

      - name: Chrome
        run: npx -y hyperframes browser ensure

      - name: Render ayarlari
        run: |
          f="projects/$P/render.json"
          q=$(jq -r '.quality // "looks"' "$f");   [[ "$q" =~ ^(draft|looks|delivery|standard|high)$ ]] || q=looks
          fps=$(jq -r '.fps // 30' "$f");          [[ "$fps" =~ ^(24|30|60)$ ]] || fps=30
          comp=$(jq -r '.composition // "index.html"' "$f"); [[ "$comp" =~ ^[A-Za-z0-9._/-]+$ && "$comp" != *..* ]] || comp=index.html
          req=$(jq -r '.request // ""' "$f" | tr -cd 'A-Za-z0-9._:+-' | cut -c1-80)
          { echo "Q=$q"; echo "FPS=$fps"; echo "COMP=$comp"; echo "REQ=$req"; } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Render
        id: render
        working-directory: projects/${{ matrix.project }}
        run: |
          export TMPDIR="$RUNNER_TEMP"
          start=$(date +%s)
          set +e
          npx -y hyperframes render --composition "$COMP" --quality "$Q" --fps "$FPS" --workers auto \
            --output "$RUNNER_TEMP/out/$P.mp4" 2>&1 | tee "$RUNNER_TEMP/out/render.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sonuc dosyasi
        if: always()
        run: |
          out="$RUNNER_TEMP/out/$P.mp4"
          status=failed; dur=null; w=null; h=null; size=0
          if [ "${{ steps.render.outputs.code }}" = "0" ] && [ -s "$out" ]; then
            status=ok
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out")
            w=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$out")
            h=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$out")
            size=$(stat -c %s "$out")
          fi
          jq -n --arg project "$P" --arg request "$REQ" --arg status "$status" --arg sha "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg quality "$Q" --argjson fps "$FPS" --argjson seconds "${{ steps.render.outputs.seconds || 0 }}" \
            --argjson duration "${dur:-null}" --argjson width "${w:-null}" --argjson height "${h:-null}" --argjson bytes "$size" \
            '{project:$project, request:$request, status:$status, commit:$sha, run:$run, quality:$quality, fps:$fps,
              render_seconds:$seconds, duration:$duration, width:$width, height:$height, bytes:$bytes}' \
            > "$RUNNER_TEMP/out/result.json"
          cat "$RUNNER_TEMP/out/result.json"
          echo "### $P: $status" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/out/result.json" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Release'e yukle
        if: always()
        run: |
          tag="render-$P"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Render: $P" --notes "KodVid otomatik render ciktisi."
          files=("$RUNNER_TEMP/out/result.json" "$RUNNER_TEMP/out/render.log")
          [ -s "$RUNNER_TEMP/out/$P.mp4" ] && files+=("$RUNNER_TEMP/out/$P.mp4")
          gh release upload "$tag" "${files[@]}" --clobber
          [ "$(jq -r .status "$RUNNER_TEMP/out/result.json")" = ok ]
